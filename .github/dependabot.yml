#
# Keeps the SHA-pinned GitHub Actions and the hashed documentation toolchain
# up to date. The vLLM and nginx images and the model revision are pinned in
# .env.example and are updated manually (see "Upgrading" in docs/installation.md).
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
  - package-ecosystem: "pip"
    directory: "/docs"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "docs"
