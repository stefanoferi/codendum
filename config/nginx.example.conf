#
# Codendum: HTTPS reverse proxy in front of vLLM (example configuration).
#
# The file belongs in the "http" context. It is used unchanged by both setups:
#   - Docker (default): scripts/start-proxy.sh --init copies it to
#     $CODENDUM_PROXY_DIR/conf.d/codendum.conf and mounts that directory, the
#     certificate and the key map at the /etc/nginx/... paths used below.
#   - Distribution nginx: copy it to /etc/nginx/conf.d/ and put the certificate
#     and key map under /etc/nginx/codendum/.
# Before use, replace:
#   llm.lab.example                  -> the service host name
#   192.0.2.0/24, 198.51.100.0/24    -> your classroom/office LAN and VPN ranges
#   8443                             -> another port, if 8443 is taken on the host
#   /etc/nginx/codendum/tls/*.pem    -> a certificate trusted by the workstations
#   /etc/nginx/codendum/api-keys.map -> generated by scripts/gen-api-keys.sh
#
# What this file does, in request order:
#   1. network allowlist (geo)            -> 403 for other addresses
#   2. per-user API key (map)             -> 401 without a valid key
#   3. per-user and global in-flight caps -> 429 when exceeded
#   4. forwards only /v1/chat/completions and /v1/models to 127.0.0.1:8000,
#      with streaming (SSE) unbuffered; everything else answers 404.
# It does NOT provide per-user token quotas or fair scheduling; see README.

# --- 1. Networks allowed to use the service (placeholders) -----------------
geo $codendum_allowed_network {
    default          0;
    127.0.0.1/32     1;   # the host itself (smoke tests through the proxy)
    192.0.2.0/24     1;   # classroom or office LAN (placeholder)
    198.51.100.0/24  1;   # VPN address pool (placeholder)
}

# --- 2. API key -> user id ---------------------------------------------------
# Lines look like: "Bearer cdm_<64 hex>" "user01";
# The file holds secrets: root:root, mode 0600, never in Git. The nginx master
# process reads it (and the TLS key) as root; workers never need access.
# Keys are 75 characters long, more than the default bucket size (64) allows.
# If your nginx.conf already sets map_hash_bucket_size, keep one of the two.
map_hash_bucket_size 128;
map $http_authorization $codendum_user {
    default "";
    include /etc/nginx/codendum/api-keys.map;
}

# --- 3. Limits ---------------------------------------------------------------
# In-flight requests per user and overall; request rate per user.
# Requests without a valid key are rejected before these limits apply.
limit_conn_zone $codendum_user zone=codendum_user_conn:1m;
limit_conn_zone $server_name   zone=codendum_total_conn:1m;
limit_req_zone  $codendum_user zone=codendum_user_rate:1m rate=60r/m;

log_format codendum '$time_iso8601 $remote_addr user=$codendum_user "$request" '
                    '$status $body_bytes_sent rt=$request_time urt=$upstream_response_time';

upstream codendum_vllm {
    server 127.0.0.1:8000;
    keepalive 16;
}

server {
    # A dedicated high port keeps the service clear of other web services on
    # the host. Clients use https://llm.lab.example:8443/v1.
    listen 8443 ssl;
    # listen [::]:8443 ssl;
    server_name llm.lab.example;

    ssl_certificate     /etc/nginx/codendum/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/codendum/tls/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:codendum_tls:10m;
    ssl_session_timeout 1h;
    server_tokens       off;

    access_log /var/log/nginx/codendum.access.log codendum;
    error_log  /var/log/nginx/codendum.error.log warn;

    # A 128K-token prompt is roughly 0.5 MB of text; leave room for JSON.
    client_max_body_size    16m;
    client_body_buffer_size 1m;

    limit_conn_status 429;
    limit_req_status  429;

    error_page 401 @codendum_401;
    error_page 403 @codendum_403;
    error_page 404 @codendum_404;
    error_page 429 @codendum_429;
    error_page 502 503 504 @codendum_unavailable;

    if ($codendum_allowed_network = 0) {
        return 403;
    }

    # --- 4. The only proxied endpoints ---------------------------------------
    # Add "completions" or "responses" to the alternation only if a client
    # needs them. /health, /metrics, /tokenize, /invocations and the rest of
    # the vLLM API stay reachable on the host only.
    location ~ ^/v1/(chat/completions|models)$ {
        # Locations match the normalized path, but proxy_pass forwards the raw
        # request URI. Reject anything not literally one of the two paths, so
        # that "/metrics/../v1/models" cannot reach a private vLLM route.
        if ($request_uri !~ "^/v1/(chat/completions|models)(\?.*)?$") {
            return 404;
        }
        if ($codendum_user = "") {
            return 401;
        }

        limit_conn codendum_user_conn 3;
        limit_conn codendum_total_conn 64;
        limit_req  zone=codendum_user_rate burst=30 nodelay;

        proxy_pass         http://codendum_vllm;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        # Never forward the user's key. If vLLM runs with VLLM_API_KEY, replace
        # this line with an include of a root-only file that sets
        #   proxy_set_header Authorization "Bearer <upstream key>";
        proxy_set_header   Authorization "";

        # Server-sent events: pass tokens through as they are produced.
        proxy_buffering off;
        proxy_cache     off;
        gzip            off;

        # Requests can wait in the vLLM queue and long prompts take time to
        # prefill. vLLM sends SSE keep-alive comments while a streamed request
        # waits (start-vllm.sh enables them), but non-streamed requests stay
        # silent until done.
        proxy_connect_timeout 5s;
        proxy_send_timeout    600s;
        proxy_read_timeout    600s;
    }

    location / {
        return 404;
    }

    # --- JSON error bodies (OpenAI-style) for errors generated by nginx ------
    # error_page keeps the original status code (for example 502 when vLLM is
    # down, 504 on timeout) and only replaces the body. Errors returned by vLLM
    # itself (400 for an over-long prompt, 503 when --max-num-queued-reqs is
    # exceeded) pass through unchanged.
    location @codendum_401 {
        default_type application/json;
        add_header WWW-Authenticate 'Bearer realm="codendum"' always;
        return 401 '{"error":{"message":"Missing or invalid API key.","type":"authentication_error","code":401}}\n';
    }
    location @codendum_403 {
        default_type application/json;
        return 403 '{"error":{"message":"This network is not allowed to use the service.","type":"permission_error","code":403}}\n';
    }
    location @codendum_404 {
        default_type application/json;
        return 404 '{"error":{"message":"Not found.","type":"invalid_request_error","code":404}}\n';
    }
    location @codendum_429 {
        default_type application/json;
        add_header Retry-After 5 always;
        return 429 '{"error":{"message":"Rate limit exceeded: too many requests in flight or per minute. Retry shortly.","type":"rate_limit_error","code":429}}\n';
    }
    location @codendum_unavailable {
        default_type application/json;
        return 502 '{"error":{"message":"The model server is unavailable or timed out. Retry later.","type":"server_error"}}\n';
    }
}
